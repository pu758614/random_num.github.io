<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f2ece0">
  <meta name="description" content="腦洞量表：抽一個秘密數字，依照數字大小回答或表演題目的派對遊戲。">
  <title>腦洞量表</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='4' y='4' width='56' height='56' rx='6' fill='%23f2ece0' stroke='%231f1b16' stroke-width='4'/><text x='32' y='45' font-size='34' font-weight='900' text-anchor='middle' fill='%23c8402a' font-family='serif'>腦</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand">腦洞量表</h1>
    <button class="text-btn" id="helpBtn" type="button">玩法</button>
  </header>

  <main>
    <!-- ───────── 設定畫面 ───────── -->
    <section id="setupView" class="view" aria-labelledby="setupTitle">
      <div class="label-row">
        <h2 id="setupTitle" class="label">本輪題目</h2>
        <span class="label muted" id="setupNo"></span>
      </div>

      <article class="panel">
        <p class="question-text" id="setupQuestion"></p>
        <div class="ruler" id="setupScale"></div>
      </article>
      <div class="row">
        <button class="btn" id="shuffleBtn" type="button">換一題</button>
        <button class="btn" id="browseBtn" type="button">從題庫挑</button>
      </div>

      <h2 class="label spaced">數字範圍</h2>
      <article class="panel range-panel">
        <div class="stepper">
          <label class="stepper-label" for="minInput">最小</label>
          <div class="stepper-ctrl">
            <button type="button" class="step" data-target="minInput" data-delta="-1" aria-label="最小值減一">−</button>
            <input type="number" id="minInput" inputmode="numeric" value="1" min="0" max="998">
            <button type="button" class="step" data-target="minInput" data-delta="1" aria-label="最小值加一">+</button>
          </div>
        </div>
        <div class="stepper">
          <label class="stepper-label" for="maxInput">最大</label>
          <div class="stepper-ctrl">
            <button type="button" class="step" data-target="maxInput" data-delta="-1" aria-label="最大值減一">−</button>
            <input type="number" id="maxInput" inputmode="numeric" value="10" min="1" max="999">
            <button type="button" class="step" data-target="maxInput" data-delta="1" aria-label="最大值加一">+</button>
          </div>
        </div>
        <p class="hint" id="rangeHint"></p>
      </article>

      <button class="btn btn-ink btn-lg btn-block" id="startBtn" type="button">開始</button>
    </section>

    <!-- ───────── 遊戲畫面 ───────── -->
    <section id="gameView" class="view" hidden aria-label="遊戲進行中">
      <article class="panel">
        <p class="question-text small" id="gameQuestion"></p>
        <div class="ruler" id="gameScale"></div>
      </article>

      <div class="draw-zone">
        <div class="flip" id="flipCard" data-state="idle">
          <div class="flip-inner">
            <div class="flip-face flip-front">
              <div class="card-back-frame">
                <span class="front-kicker">輪到</span>
                <span class="front-player" id="frontPlayer"></span>
                <span class="front-note" id="frontNote">其他人請先別看</span>
              </div>
            </div>
            <div class="flip-face flip-back">
              <span class="corner tl" id="cornerTL"></span>
              <span class="big-number" id="bigNumber"></span>
              <span class="corner br" id="cornerBR"></span>
              <div class="card-ruler" aria-hidden="true">
                <span class="card-ruler-line"><span class="card-ruler-mark" id="miniDot"></span></span>
              </div>
            </div>
          </div>
        </div>
        <p class="reminder" id="reminder" aria-live="polite"></p>
        <button class="btn btn-ink btn-lg btn-block" id="drawBtn" type="button">抽數字</button>
        <button class="btn btn-lg btn-block" id="hideBtn" type="button" hidden>記住了，蓋牌</button>
      </div>

      <div class="players-block">
        <div class="label-row">
          <h2 class="label">已抽</h2>
          <span class="label muted" id="progressText" aria-live="polite"></span>
        </div>
        <ul class="players" id="playerList"></ul>
        <p class="hint">忘了自己的數字？點你的代號。</p>
      </div>

      <div class="row actions">
        <button class="btn btn-red" id="revealBtn" type="button">公布結果</button>
        <button class="btn" id="restartBtn" type="button">重新開始</button>
      </div>
    </section>
  </main>

  <!-- ───────── 題庫 ───────── -->
  <dialog id="browseDialog" class="sheet">
    <div class="sheet-head">
      <h2>題庫 <span class="muted" id="browseCount"></span></h2>
      <button class="text-btn" type="button" data-close>關閉</button>
    </div>
    <input type="search" id="searchInput" class="search" placeholder="搜尋題目">
    <ol class="question-list" id="questionList"></ol>
  </dialog>

  <!-- ───────── 結果 ───────── -->
  <dialog id="resultDialog" class="sheet">
    <div class="sheet-head">
      <h2>結果</h2>
      <button class="text-btn" type="button" data-close>關閉</button>
    </div>
    <div class="ruler" id="resultScale"></div>
    <ol class="result-list" id="resultList"></ol>
    <button class="btn btn-ink btn-block" type="button" id="newRoundBtn">再玩一輪</button>
  </dialog>

  <!-- ───────── 找回數字 ───────── -->
  <dialog id="peekDialog" class="sheet small">
    <div class="sheet-head">
      <h2 id="peekTitle"></h2>
      <button class="text-btn" type="button" data-close>關閉</button>
    </div>
    <p class="muted">確認只有你在看螢幕再按。</p>
    <div class="peek-number" id="peekNumber" hidden></div>
    <button class="btn btn-ink btn-block" type="button" id="peekShowBtn">翻開</button>
    <button class="btn btn-block" type="button" id="peekDoneBtn" data-close hidden>記得了</button>
  </dialog>

  <!-- ───────── 確認 ───────── -->
  <dialog id="confirmDialog" class="sheet small">
    <h2 id="confirmTitle"></h2>
    <p class="muted" id="confirmText"></p>
    <div class="row">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn btn-ink" type="button" id="confirmOk">確定</button>
    </div>
  </dialog>

  <!-- ───────── 說明 ───────── -->
  <dialog id="helpDialog" class="sheet">
    <div class="sheet-head">
      <h2>玩法</h2>
      <button class="text-btn" type="button" data-close>關閉</button>
    </div>
    <ol class="help-list">
      <li>選一道題目，設定數字範圍後開始。</li>
      <li>手機輪流傳下去，每人抽一個秘密數字，看完蓋牌再傳。</li>
      <li>照自己的數字回答或表演——數字越大，越靠近題目的「最高」那端。</li>
      <li>大家一起猜每個人的順序，最後公布結果對答案。</li>
    </ol>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/questions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
